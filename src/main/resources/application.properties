spring.application.name=SriramMart
server.port=${PORT:8080}
server.address=0.0.0.0

# ---- Database (default = embedded H2 file DB, zero installation needed) ----
# Switch to Postgres (Render/Supabase) / MySQL / SQL Server with:
#   --spring.profiles.active=postgres   or   mysql   or   sqlserver
# Or set DATABASE_URL (Render PostgreSQL standard environment variable)
spring.datasource.url=${DATABASE_URL:${DB_URL:jdbc:h2:file:./data/srirammart;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1}}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASS:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true

# ---- Web ----
spring.thymeleaf.cache=${THYMELEAF_CACHE:true}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=12MB
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.error.include-message=never
server.error.include-stacktrace=never
server.compression.enabled=true
spring.web.resources.cache.cachecontrol.max-age=7d

# ---- Application ----
app.uploads-dir=${UPLOAD_DIR:./uploads}
# The whole site needs a login (userid + password); there are no public pages except login/register.
# demo users, orders and reviews on first start (set false for production)
app.seed-demo-data=${SEED_DEMO_DATA:true}
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.email=${ADMIN_EMAIL:admin@srirammart.local}
app.admin.password=${ADMIN_PASSWORD:Admin@123}
app.remember-me-key=${REMEMBER_ME_KEY:change-this-remember-me-key-in-production}

# ---- AI assistant ----
# The assistant always answers from the live store database (products, stock, offers, orders).
# If an OpenAI-compatible chat endpoint is reachable it is used to phrase answers more naturally.
chatbot.enabled=true
chatbot.api.url=${CHATBOT_API_URL:https://gen.pollinations.ai/v1/chat/completions}
chatbot.api.model=${CHATBOT_API_MODEL:openai}
chatbot.api.key=${CHATBOT_API_KEY:}
chatbot.api.timeout-seconds=15
